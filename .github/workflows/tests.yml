name: Tests

# Runs the module's shipped code against a stubbed Foundry.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The module parses
        run: node --check scripts/overlay-palette.js

      - name: Run the tests
        run: node --test tests/*.test.mjs
